# main 에 올라오면 Windows exe 를 빌드해 GitHub Release 로 올린다.
# 배포: FlightData_<VERSION>.zip (폴더 FlightData_<VERSION>\ 안에 FlightData_<VERSION>.exe · README_KR.txt · 빈 OpenSky_CSV\) — 사용자 요청 2026-10-28.
# 버전: VERSION 파일 (VERSION 파일, 예 1.0.32 — 패치할 때마다 마지막 숫자를 올림, 사용자 요청 2026-10-28)
# 최신 릴리스 페이지: https://github.com/<owner>/<repo>/releases/latest
name: Build & release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip trino pyinstaller tzdata pywebview pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test (파이썬 · 분석 엔진 · 모듈 import 정리 상태)
        run: |
          python -m pytest -q tests
          npm ci
          npm run check
      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path _build.py -Value "BUILD = `"$v`"" -Encoding utf8
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name FlightData --icon icon.ico --collect-submodules trino --collect-all webview --collect-data tzdata --add-data "web;web" --hidden-import _build flightdata_app.py
      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FlightData.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - name: Zip (폴더째 배포)
        shell: pwsh
        run: |
          $d = "pkg\FlightData_${{ env.VER }}"
          New-Item -ItemType Directory -Force -Path "$d\OpenSky_CSV" | Out-Null
          Copy-Item dist\FlightData.exe "$d\FlightData_${{ env.VER }}.exe"
          Copy-Item README_KR.txt $d
          # 빈 OpenSky_CSV 폴더도 넣으려고 .NET ZipFile 사용 (Compress-Archive 는 빈 폴더를 뺌)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path "pkg").Path, "$PWD\dist\FlightData_${{ env.VER }}.zip")
      - name: Release notes (CHANGELOG.md 의 이 버전 부분)
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $out = @(); $on = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') { if ($on) { break }; if ($l.Trim() -eq "## ${{ env.VER }}") { $on = $true; continue } }
            if ($on) { $out += $l }
          }
          $head = @(
            "FlightData_${{ env.VER }}.zip 을 받아 **압축을 푼 뒤** 폴더 안의 FlightData_${{ env.VER }}.exe 를 더블클릭하세요 (설치 필요 없음).",
            "처음 실행할 때 `"Windows의 PC 보호`" 경고가 뜨면 [추가 정보] → [실행].",
            "",
            "### 이번 버전에서 바뀐 것")
          $tail = @("", "전체 패치 노트: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md")
          ($head + $out + $tail) | Set-Content -Path notes.md -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: FlightData_${{ env.VER }}
          make_latest: true
          body_path: notes.md
          files: |
            dist/FlightData_${{ env.VER }}.zip
