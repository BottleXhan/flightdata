# main 에 올라오면 Windows exe 를 빌드해 GitHub Release 로 올린다.
# 배포: FlightData_<VERSION>.zip (폴더 FlightData_<VERSION>\ 안에 FlightData.exe · README_KR.txt · 빈 OpenSky_CSV\) — 사용자 요청 2026-10-28.
# 버전: VERSION 파일 (VERSION 파일, 예 1.0.32 — 패치할 때마다 마지막 숫자를 올림, 사용자 요청 2026-10-28)
# 최신 릴리스 페이지: https://github.com/<owner>/<repo>/releases/latest
name: Build & release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip trino pyinstaller tzdata pywebview
      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path _build.py -Value "BUILD = `"$v`"" -Encoding utf8
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name FlightData --icon icon.ico --collect-submodules trino --collect-all webview --collect-data tzdata --add-data "web;web" --hidden-import _build flightdata_app.py
      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FlightData.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - name: Zip (폴더째 배포)
        shell: pwsh
        run: |
          $d = "pkg\FlightData_${{ env.VER }}"
          New-Item -ItemType Directory -Force -Path "$d\OpenSky_CSV" | Out-Null
          Copy-Item dist\FlightData.exe $d
          Copy-Item README_KR.txt $d
          # 빈 OpenSky_CSV 폴더도 넣으려고 .NET ZipFile 사용 (Compress-Archive 는 빈 폴더를 뺌)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path "pkg").Path, "$PWD\dist\FlightData_${{ env.VER }}.zip")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: FlightData_${{ env.VER }}
          make_latest: true
          body: |
            Windows 용 FlightData_${{ env.VER }} 입니다. FlightData_${{ env.VER }}.zip 을 받아 **압축을 푼 뒤** 폴더 안의 FlightData.exe 를 더블클릭하세요 (설치 필요 없음).
            폴더 안에 설정·항공기 DB·보관함(app_data)·받은 CSV(OpenSky_CSV)가 함께 쌓이므로, 이 폴더를 통째로 옮기면 다른 PC 에서도 그대로 씁니다.
            처음 실행할 때 "Windows의 PC 보호" 경고가 뜨면 [추가 정보] → [실행].
            한 창에서 OpenSky 운항 CSV 를 받고(1 데이터 → "OpenSky에서 받기") 바로 분석합니다.
            사용법: https://github.com/${{ github.repository }}#readme
          files: |
            dist/FlightData_${{ env.VER }}.zip
