# main 에 올라오면 Windows exe 를 빌드해 GitHub Release 로 올린다.
# 최신 exe 고정 주소: https://github.com/<owner>/<repo>/releases/latest/download/FlightData_Collector.exe
name: Build & release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip trino pyinstaller customtkinter tkcalendar tzdata
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name FlightData_Collector --collect-submodules trino --collect-all customtkinter --collect-all tkcalendar --collect-data tzdata --collect-data babel --hidden-import babel.numbers --add-data "airports.json;." --add-data "land.json;." fetch_gui.py
      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FlightData_Collector.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenSky CSV 수집기 (빌드 ${{ github.run_number }})
          make_latest: true
          body: |
            Windows 용 FlightData 수집기입니다. 설치 없이 FlightData_Collector.exe 를 더블클릭하세요.
            처음 실행할 때 "Windows의 PC 보호" 경고가 뜨면 [추가 정보] → [실행].
            사용법은 README_KR.txt 를 보세요.
          files: |
            dist/FlightData_Collector.exe
            README_KR.txt
